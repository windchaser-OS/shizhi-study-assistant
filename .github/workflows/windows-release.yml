name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing version tag, for example v1.0.0 (blank builds the selected branch)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish a new GitHub Release for the supplied existing tag'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and tag
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release version must be 1.0.0-style semantic version' }
          $tag = if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:INPUT_TAG }
          if ($env:INPUT_PUBLISH -eq 'true' -and -not $tag) { throw 'Publishing requires an existing version tag' }
          if ($tag) {
            if ($tag -cne "v$version") { throw "Tag must exactly match package.json: v$version" }
            $tagCommit = git rev-parse --verify "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0) { throw 'Version tag does not exist' }
            $headCommit = git rev-parse HEAD
            if ($tagCommit -ne $headCommit) { throw 'Checked-out code differs from the version tag' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Set up Python 3.12.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency validation failed' }
      - name: Install verified Inno Setup 6.7.3
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Inno Setup download checksum mismatch' }
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $compilerDirectory + '"'))
          $process = Start-Process -FilePath $download -ArgumentList $arguments -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "INNO_ISCC=$(Join-Path $compilerDirectory 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Test, build, smoke test and audit release files
        shell: pwsh
        run: ./scripts/build-windows.ps1 -PythonExe python -IsccPath $env:INNO_ISCC
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1 -InstallerPath "dist/release/shizhi-study-assistant-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
      - name: Upload audited distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shizhi-study-assistant-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/release/shizhi-study-assistant-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/release/shizhi-study-assistant-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shizhi-study-assistant-${{ needs.build.outputs.version }}-windows-x64
          path: release
      - name: Check digests and create release without replacing existing releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -cne "v$($env:RELEASE_VERSION)") { throw 'Refusing a mismatched release tag' }
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (shizhi-study-assistant-[0-9.]+-windows-x64-(setup\.exe|portable\.zip))$') { throw 'Malformed SHA256SUMS.txt' }
            $expected, $filename = $Matches[1], $Matches[2]
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release' $filename) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected) { throw "Release checksum mismatch: $filename" }
          }
          $existing = gh api "repos/$($env:GH_REPO)/releases/tags/$tag" 2>&1 | Out-String
          $apiExitCode = $LASTEXITCODE
          if ($apiExitCode -eq 0) {
            $release = $existing | ConvertFrom-Json
            $expectedAssets = @(
              "shizhi-study-assistant-$($env:RELEASE_VERSION)-windows-x64-setup.exe",
              "shizhi-study-assistant-$($env:RELEASE_VERSION)-windows-x64-portable.zip",
              'SHA256SUMS.txt'
            )
            $missingAssets = @($expectedAssets | Where-Object { $_ -notin $release.assets.name })
            if (-not $release.draft -and $missingAssets.Count -eq 0) {
              Write-Host 'A published release already contains all distribution files; leaving it unchanged.'
              exit 0
            }
            throw 'A draft or incomplete release already exists; existing assets will not be overwritten'
          }
          if ($existing -notmatch 'HTTP 404') { throw "Cannot verify absence of the release: $existing" }
          $notes = @(
            "拾知学习空间 $($env:RELEASE_VERSION) — Windows 10/11 64 位。",
            '',
            '- 下载 setup.exe，运行简体中文安装向导即可使用，无需安装 Python 或 Node.js。',
            '- portable.zip 解压后运行 ShizhiStudyAssistant.exe；须保留同目录的 _internal 文件夹。',
            '- 笔记、数据库和 API 连接配置保存在本机用户目录，卸载保留这些资料。',
            '- SHA256SUMS.txt 提供发布文件的完整性校验。',
            '- 本版本未做 Windows 代码签名。'
          )
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-notes.md'), (($notes -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          gh release create $tag --repo $env:GH_REPO --verify-tag --title "拾知学习空间 $($env:RELEASE_VERSION)" --notes-file (Join-Path $env:RUNNER_TEMP 'release-notes.md') "release/shizhi-study-assistant-$($env:RELEASE_VERSION)-windows-x64-setup.exe" "release/shizhi-study-assistant-$($env:RELEASE_VERSION)-windows-x64-portable.zip" release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed; no existing release was modified' }
